<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои задачи</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="upwork-demo">
            This is a demo project created specifically for Upwork to demonstrate my skills.
        </div>

        <div class="container">
            <h1>📋 Мои задачи</h1>
            
            <div class="stats" id="stats">0 из 0 выполнено</div>
            
            <div class="add-task">
                <input type="text" id="taskInput" placeholder="Что нужно сделать?">
                <button onclick="addTask()">Добавить</button>
            </div>

            <div class="filters">
                <button onclick="setFilter('all')" class="active" id="filter-all">Все</button>
                <button onclick="setFilter('active')" id="filter-active">Активные</button>
                <button onclick="setFilter('completed')" id="filter-completed">Выполненные</button>
            </div>

            <ul id="taskList"></ul>

            <button onclick="clearCompleted()" class="clear-btn">Очистить выполненные</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
